name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails on high/critical advisories in production dependencies only;
      # dev-only advisories are excluded by --omit=dev.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test
      - run: npx tsc --noEmit
      # Lints the whole repository, so a violation in an untouched file still
      # fails, and no base-ref diff is needed on push/merge_group events.
      - name: Lint
        run: npm run lint
      - run: npm run build
        env:
          GATEWAY_API_URL: http://localhost:8000
