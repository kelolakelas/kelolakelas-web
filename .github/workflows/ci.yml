name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails on high/critical advisories in production dependencies only;
      # dev-only advisories are excluded by --omit=dev.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test
      - run: npx tsc --noEmit
      - name: Lint changed TypeScript files
        run: |
          git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' |
            xargs --no-run-if-empty npx eslint
      - run: npm run build
        env:
          GATEWAY_API_URL: http://localhost:8000
